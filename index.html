    var k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(D.s), iterations:D.n, hash:'SHA-256'}, km, {name:'AES-CBC', length:256}, false, ['decrypt']);
    var pt = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv:bytes(D.i)}, k, bytes(D.c)));
    if (pt.indexOf('<!--ok-->') !== 0) throw new Error('bad');
    return pt.slice(9);
  }
  function show(html){ document.open(); document.write(html); document.close(); }
  var f = document.getElementById('f'), m = document.getElementById('m');
  f.addEventListener('submit', function(e){
    e.preventDefault(); var pw = norm(document.getElementById('p').value); m.textContent = 'Checking…';
    unlock(pw).then(function(html){ try { localStorage.setItem(SAVE, pw); } catch(x){} show(html); },
                    function(){ m.textContent = 'Wrong passcode.'; });
  });
  var saved = null; try { saved = localStorage.getItem(SAVE); } catch(x){}
  if (saved) unlock(saved).then(show, function(){ f.style.display = 'block'; });
  else f.style.display = 'block';
})();
</script>
